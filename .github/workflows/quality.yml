name: Calidad

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Ruff, Pyrefly y suite completa
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias bloqueadas
        run: uv sync --locked

      - name: Instalar Chromium
        run: uv run playwright install --with-deps chromium

      - name: Ruff
        run: uv run ruff check .

      - name: Pyrefly
        run: uv run pyrefly check

      - name: Pruebas unitarias
        run: uv run pytest tests/unit

      - name: Pruebas de integración
        run: uv run pytest tests/integration

      - name: Pruebas extremo a extremo
        run: uv run pytest tests/e2e

      - name: Pruebas de regresión
        run: uv run pytest -m regression

      - name: Pruebas no funcionales
        run: uv run pytest -m nonfunctional
