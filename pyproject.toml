[project]
name = "contabilidad-empresas"
version = "0.1.0"
description = "Sistema simplificado de contabilidad empresarial para pruebas de calidad."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=0.32.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["app.py", "src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/contabilidad"]
